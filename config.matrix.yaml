# Generator x critic matrix config (Task A2). Model IDs, licences and prices verified 2026-11-11; see
# docs/model_selection.md. Re-check prices before running. Freeze before the main run: changing anything here after
# generation starts invalidates the comparison - bump run_id instead.
#
# Keys come from the environment only: ANTHROPIC_API_KEY for Anthropic, and the variable NAMED in `api_key_env` for
# OpenAI-compatible hosts (here OPENROUTER_API_KEY). Never put a key in this file.
#
# Labels attach to rewrites, not critics: every extra critic reuses the same human labels and costs only API dollars;
# every extra generator adds ~348 outputs to label (124 x 2 styles + 100 realistic), or a stratified 50% + PPI.
run_id: matrix-v1

generators:              # rewriters under audit; `family` feeds the self-preference analysis
  - name: haiku55
    family: anthropic
    provider: anthropic
    model: claude-haiku-5-5
    settings: {effort: low, max_tokens: 1024}
  - name: sonnet55
    family: anthropic
    provider: anthropic
    model: claude-sonnet-5-5
    settings: {effort: low, max_tokens: 1024}
  - name: qwen38            # open-weight (Apache-2.0), Qwen/Qwen3.8-27B; a school could self-host it
    family: alibaba-qwen
    provider: openai_compat
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model: qwen/qwen3.8-27b
    settings:
      max_tokens: 1024
      # Qwen's recommended non-thinking sampling (model card); thinking is on by default and disabled here
      temperature: 0.7
      top_p: 0.8
      presence_penalty: 1.5
      seed: 2880
      extra_body:
        top_k: 20
        chat_template_kwargs: {enable_thinking: false}
        provider: {data_collection: deny, zdr: true}   # only providers that do not store or train on prompts
  # Add when keys exist (Task F); each needs its own labelling batch (or 50% + PPI):
  # - {name: gpt6luna, family: openai, provider: openai, model: gpt-6-luna, settings: {reasoning_effort: none, temperature: 0, max_output_tokens: 1024}}
  # - {name: gemini38flash, family: google, provider: google, model: gemini-3.8-flash, settings: {thinking_level: low, max_output_tokens: 2048}}

primary_critic: opus55   # prespecified: drives REVIEW/REJECT, repair and the Phase-1 analysis
critics:
  - name: opus55
    family: anthropic
    provider: anthropic
    model: claude-opus-5-5
    settings: {effort: low, max_tokens: 4096}
  - name: sonnet55c
    family: anthropic
    provider: anthropic
    model: claude-sonnet-5-5
    settings: {effort: low, max_tokens: 4096}
  - name: qwen38c
    family: alibaba-qwen
    provider: openai_compat
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model: qwen/qwen3.8-27b
    settings:
      max_tokens: 2048
      temperature: 0      # low-variance judging (critics are not the object of the audit)
      seed: 2880
      extra_body:
        chat_template_kwargs: {enable_thinking: false}
        provider: {data_collection: deny, zdr: true}
  - name: qwen35_9b       # "runs on a laptop" end: Qwen/Qwen3.5-9B (Apache-2.0); cheap pre-filter candidate
    family: alibaba-qwen
    provider: openai_compat
    base_url: https://openrouter.ai/api/v1   # or a local server, e.g. http://localhost:11434/v1 with no api_key_env
    api_key_env: OPENROUTER_API_KEY
    model: qwen/qwen3.5-9b
    settings:
      max_tokens: 2048
      temperature: 0
      seed: 2880
      extra_body:
        chat_template_kwargs: {enable_thinking: false}
        provider: {data_collection: deny, zdr: true}
  # - {name: gpt6lunac, family: openai, provider: openai, model: gpt-6-luna, settings: {reasoning_effort: none, temperature: 0, max_output_tokens: 2048}}
  # - {name: gemini38flashc, family: google, provider: google, model: gemini-3.8-flash, settings: {thinking_level: low, max_output_tokens: 4096}}

extractor:               # one extractor so the program layer is constant across critics
  family: anthropic
  provider: anthropic
  model: claude-opus-5-5
  settings: {effort: low, max_tokens: 4096}

transformations: [plain, chunked]
ablation:
  transformation: naive
  partition: main
  first_n: 100

partitions: [main, ext_asdiv, ext_gsm1k]

minutes_per_review: 1.5

# USD per 1M tokens. Anthropic: pricing table (Oct 2026). OpenRouter prices vary by serving provider; these are
# conservative upper bounds over the listed providers (2026-11-11). The ledger uses the host-reported cost
# (usage.cost) when a row has one.
prices:
  claude-haiku-5-5: {in: 0.10, out: 0.50}
  claude-sonnet-5-5: {in: 2.00, out: 10.00}
  claude-opus-5-5: {in: 4.00, out: 20.00}
  qwen/qwen3.8-27b: {in: 0.99, out: 3.20}     # listed range 0.035-0.99 in / 0.42-3.20 out
  qwen/qwen3.5-9b: {in: 0.17, out: 0.25}      # listed range 0.08-0.17 in / 0.13-0.25 out
  gpt-6-luna: {in: 0.10, out: 0.50}           # [snippet] re-check before use
  gemini-3.8-flash: {in: 0.75, out: 3.75}     # introductory price until 2026-12-31
